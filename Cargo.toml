[package]
name = "tail-web"
version = "0.1.0"
edition = "2024"
description = "tail in Rust: backward seeking, kqueue/inotify following and a live web viewer"
license = "MIT"
repository = "https://github.com/andersonmrodrigues/tail-web"
readme = "README.md"
keywords = ["tail", "cli", "logs", "kqueue", "inotify"]
categories = ["command-line-utilities"]

[[bin]]
name = "rtail"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = "1.12.0"
tempfile = "3.27.0"
