<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>rtail</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2315131c'/><path d='M8 10l6 6-6 6' stroke='%237dd6e8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><rect x='16' y='20' width='9' height='2.6' rx='1.3' fill='%237dd6e8'/></svg>">
<style>
:root {
  --bg: #15131c;
  --bg-sunk: #100e16;
  --bg-raised: #1d1a27;
  --rule: #2b2839;
  --text: #dcd8e8;
  --text-dim: #8b85a1;
  --text-faint: #5e5973;
  --live: #7dd6e8;
  --err: #ff7b86;
  --warn: #f2bb5c;
  --info: #93b4ff;
  --debug: #6c6784;
  --mark: rgba(125, 214, 232, .26);
  --shadow: 0 8px 24px rgba(0, 0, 0, .45);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gutter: 7ch;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f5f9;
    --bg-sunk: #eeecf3;
    --bg-raised: #ffffff;
    --rule: #dcd9e5;
    --text: #24212f;
    --text-dim: #615b75;
    --text-faint: #9d97ae;
    --live: #0d8199;
    --err: #c42f3e;
    --warn: #9a6200;
    --info: #2f5fd0;
    --debug: #8f8aa3;
    --mark: rgba(13, 129, 153, .2);
    --shadow: 0 8px 24px rgba(36, 33, 47, .18);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  grid-template-rows: auto auto auto 1fr;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 var(--sans);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

.top {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px;
  padding: 10px 16px;
  background: var(--bg-sunk);
}
.brand { display: flex; align-items: center; gap: 3px; font: 700 16px/1 var(--mono); letter-spacing: -.02em; }
.caret { width: .55em; height: 1.05em; background: var(--live); animation: blink 1.1s steps(1) infinite; }
.brand.paused .caret { animation: none; opacity: .35; }
.brand.offline .caret { animation: none; background: var(--text-faint); }
@keyframes blink { 50% { opacity: 0; } }
.rate { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.rate svg { width: 128px; height: 24px; overflow: visible; }
.rate .area { fill: color-mix(in srgb, var(--live) 16%, transparent); }
.rate .stroke { fill: none; stroke: var(--live); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.rate output { min-width: 6ch; }
.stats { margin-left: auto; display: flex; align-items: center; gap: 16px; color: var(--text-dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.conn { display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-faint); }
.dot[data-status="connected"] { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 20%, transparent); }
.dot[data-status="reconnecting"], .dot[data-status="connecting"] { background: var(--warn); }
.dot[data-status="closed"] { background: var(--err); }

.tabs {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  padding: 0 10px;
  background: var(--bg-sunk);
  border-bottom: 1px solid var(--rule);
}
.tab {
  display: flex; align-items: center; gap: 8px; flex: none;
  padding: 8px 12px 9px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--text-dim); font: 12.5px var(--mono);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--live); }
.tab:focus-visible { outline-offset: -2px; }
.badge {
  min-width: 18px; padding: 1px 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--live) 18%, transparent); color: var(--live);
  font-size: 11px; text-align: center; font-variant-numeric: tabular-nums;
}

.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--rule);
}
.filter {
  flex: 1 1 280px; max-width: 520px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 4px 0 10px;
  background: var(--bg-sunk); border: 1px solid var(--rule); border-radius: 6px;
  color: var(--text-faint);
}
.filter:focus-within { border-color: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 18%, transparent); }
.filter.invalid { border-color: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 18%, transparent); }
.filter input {
  flex: 1; min-width: 0; padding: 7px 2px;
  background: transparent; border: 0; outline: none;
  color: var(--text); font: 13px var(--mono);
}
.filter input::placeholder { color: var(--text-faint); }
.filter input::-webkit-search-cancel-button { display: none; }
.filter kbd {
  padding: 0 6px; border: 1px solid var(--rule); border-radius: 4px;
  font: 11px/18px var(--mono); color: var(--text-faint);
}
.filter:focus-within kbd, .filter.has-value kbd { display: none; }
.re {
  padding: 3px 7px; border: 1px solid transparent; border-radius: 4px; background: none;
  color: var(--text-faint); font: 600 12px var(--mono);
}
.re[aria-pressed="true"] { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); border-color: color-mix(in srgb, var(--live) 40%, transparent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: none; border: 1px solid var(--rule);
  color: var(--text); font-size: 12px;
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--swatch); }
.chip[aria-pressed="false"] { color: var(--text-faint); text-decoration: line-through; }
.chip[aria-pressed="false"]::before { background: transparent; box-shadow: inset 0 0 0 1px var(--text-faint); }
.chip[data-level="error"] { --swatch: var(--err); }
.chip[data-level="warn"] { --swatch: var(--warn); }
.chip[data-level="info"] { --swatch: var(--info); }
.chip[data-level="debug"] { --swatch: var(--debug); }
.chip[data-level="other"] { --swatch: var(--text-dim); }

.actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.count { margin-right: 6px; color: var(--text-dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.count.error { color: var(--err); }
.btn {
  padding: 5px 11px; border-radius: 6px;
  background: var(--bg-raised); border: 1px solid var(--rule);
  font: 12px var(--mono); white-space: nowrap;
}
.btn:hover { border-color: var(--text-faint); }
.btn[aria-pressed="true"] { color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, transparent); background: color-mix(in srgb, var(--live) 10%, var(--bg-raised)); }

.viewport { position: relative; min-height: 0; }
.log {
  position: absolute; inset: 0; overflow-y: auto;
  padding: 8px 0 28px;
  font: 12.5px/1.6 var(--mono);
  scrollbar-color: var(--rule) transparent;
  tab-size: 4;
}
.log:focus-visible { outline-offset: -2px; }
.row {
  position: relative; min-height: 1.6em;
  padding: 0 16px 0 14px;
  border-left: 2px solid transparent;
  white-space: pre-wrap; overflow-wrap: anywhere;
  content-visibility: auto; contain-intrinsic-size: auto 1.6em;
}
.row:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
.numbered .row { padding-left: calc(var(--gutter) + 24px); }
.numbered .row[data-n]::before, .numbered .row.sys::before {
  position: absolute; left: 8px; width: var(--gutter); text-align: right;
  color: var(--text-faint); user-select: none;
}
.numbered .row[data-n]::before { content: attr(data-n); }
.row[data-level="error"] { border-left-color: var(--err); background: color-mix(in srgb, var(--err) 9%, transparent); color: color-mix(in srgb, var(--err) 30%, var(--text)); }
.row[data-level="warn"] { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 7%, transparent); color: color-mix(in srgb, var(--warn) 25%, var(--text)); }
.row[data-level="info"] { border-left-color: color-mix(in srgb, var(--info) 45%, transparent); }
.row[data-level="debug"] { color: var(--debug); }
.row.sys {
  margin: 6px 0; padding-top: 3px; padding-bottom: 3px;
  border-left-color: var(--live); color: var(--live);
  background: color-mix(in srgb, var(--live) 8%, transparent);
  border-top: 1px dashed color-mix(in srgb, var(--live) 30%, transparent);
  border-bottom: 1px dashed color-mix(in srgb, var(--live) 30%, transparent);
}
.row.sys[data-level="lagged"] { border-left-color: var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); border-left-color: var(--warn); }
.row.sys::before { content: "rtail"; font-weight: 700; color: inherit; opacity: .7; margin-right: 1ch; }
.numbered .row.sys::before { margin: 0; }
mark {
  background: var(--mark); color: inherit; border-radius: 2px;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--live) 45%, transparent);
}
.empty {
  position: absolute; inset: 0; margin: 0; padding: 24px;
  display: grid; place-items: center; text-align: center;
  color: var(--text-dim); font: 13px var(--mono); pointer-events: none;
}
.jump {
  position: absolute; right: 22px; bottom: 18px;
  padding: 8px 14px; border: 0; border-radius: 999px;
  background: var(--live); color: var(--bg-sunk); box-shadow: var(--shadow);
  font: 600 12px var(--mono);
}

@media (max-width: 640px) {
  :root { --gutter: 5ch; }
  .top, .toolbar { padding-left: 12px; padding-right: 12px; }
  .rate svg { width: 72px; }
  .stats { gap: 10px; }
  .filter { flex-basis: 100%; max-width: none; }
  .actions { margin-left: 0; flex-wrap: wrap; }
  .log { font-size: 12px; }
  .row { padding-right: 12px; }
  .jump { right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand"><span>rtail</span><span class="caret" aria-hidden="true"></span></div>
  <div class="rate" title="Lines per second over the last minute">
    <svg viewBox="0 0 120 24" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="sparkArea"/><path class="stroke" id="sparkLine"/></svg>
    <output id="rate">0/s</output>
  </div>
  <div class="stats">
    <span class="conn"><span class="dot" id="connDot"></span><span id="connText">connecting</span></span>
    <span id="total">0 lines</span>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Followed files"></nav>

<div class="toolbar">
  <div class="filter" id="filterBox">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="filter" type="search" placeholder="Filter lines" aria-label="Filter lines" spellcheck="false" autocomplete="off">
    <kbd>/</kbd>
    <button id="regex" class="re" type="button" aria-pressed="false" title="Match as a regular expression">.*</button>
  </div>
  <div class="chips" role="group" aria-label="Show log levels">
    <button class="chip" type="button" data-level="error" aria-pressed="true">Error</button>
    <button class="chip" type="button" data-level="warn" aria-pressed="true">Warn</button>
    <button class="chip" type="button" data-level="info" aria-pressed="true">Info</button>
    <button class="chip" type="button" data-level="debug" aria-pressed="true">Debug</button>
    <button class="chip" type="button" data-level="other" aria-pressed="true">Other</button>
  </div>
  <div class="actions">
    <span class="count" id="count" aria-live="polite"></span>
    <button class="btn" id="numbers" type="button" aria-pressed="true" title="Show line numbers">#</button>
    <button class="btn" id="pause" type="button" aria-pressed="false" title="Pause or resume (Space)">Pause</button>
    <button class="btn" id="clear" type="button" title="Clear this tab's lines in the browser">Clear</button>
  </div>
</div>

<main class="viewport">
  <div class="log numbered" id="log" role="log" aria-live="off" aria-label="Log lines" tabindex="0"></div>
  <p class="empty" id="empty">Loading files…</p>
  <button class="jump" id="jump" type="button" hidden>Jump to latest ↓</button>
</main>

<script>
'use strict';

const CAP = 20000;
const SLACK = 1000; // hysteresis so trimming is amortized instead of per line
const LEVEL_RE = /\b(error|fatal|panic|warn(?:ing)?|info|debug|trace)\b/i;
const LEVEL_OF = { error: 'error', fatal: 'error', panic: 'error', warn: 'warn', warning: 'warn', info: 'info', debug: 'debug', trace: 'debug' };
const SPARK_SAMPLES = 60;

const $ = (id) => document.getElementById(id);
const ui = {
  brand: $('brand'), rate: $('rate'), sparkArea: $('sparkArea'), sparkLine: $('sparkLine'),
  connDot: $('connDot'), connText: $('connText'), total: $('total'), tabs: $('tabs'),
  filterBox: $('filterBox'), filter: $('filter'), regex: $('regex'), count: $('count'),
  numbers: $('numbers'), pause: $('pause'), clear: $('clear'),
  log: $('log'), empty: $('empty'), jump: $('jump'),
};
const nf = new Intl.NumberFormat('en-US');

const files = [];
let active = -1;
let paused = false;
let bootError = null;
let frameQueued = false;
let rateCount = 0;
const rateSamples = new Array(SPARK_SAMPLES).fill(0);
const levelsOn = new Set(['error', 'warn', 'info', 'debug', 'other']);
const filter = { text: '', needle: '', regex: false, re: null, reAll: null, error: null };
// What the log pane currently shows: which file, the newest entry id rendered, visible line count.
const view = { file: null, renderedId: 0, shown: 0, follow: true };

function basename(path) {
  return path.split(/[\\/]/).filter(Boolean).pop() || path;
}

function levelOf(text) {
  const m = LEVEL_RE.exec(text);
  return m ? LEVEL_OF[m[1].toLowerCase()] : 'other';
}

// ---- Streams ----

function makeFile({ index, name }) {
  return { index, name, base: basename(name), entries: [], nextId: 1, lines: 0, received: 0, unread: 0, status: 'connecting', tab: null };
}

function connect(file) {
  const es = new EventSource('/events/' + file.index);
  es.onopen = () => {
    // The server replays its backlog on every (re)connect, so start from scratch.
    resetBuffer(file, true);
    file.status = 'connected';
    schedule();
  };
  es.onerror = () => {
    file.status = es.readyState === EventSource.CLOSED ? 'closed' : 'reconnecting';
    schedule();
  };
  es.addEventListener('line', (e) => ingest(file, 'line', decodeText(e.data)));
  es.addEventListener('notice', (e) => ingest(file, 'notice', decodeText(e.data)));
  es.addEventListener('lagged', (e) => {
    const n = decodeJson(e.data);
    const count = Number.isFinite(n) ? nf.format(n) : String(e.data);
    ingest(file, 'lagged', `⚠ ${count} lines skipped (viewer fell behind)`);
  });
}

// Event data is JSON-encoded so empty lines survive SSE; fall back to the raw payload if it is not.
function decodeJson(raw) {
  try { return JSON.parse(raw); } catch { return raw; }
}

function decodeText(raw) {
  const value = decodeJson(raw);
  return typeof value === 'string' ? value : String(raw);
}

function ingest(file, kind, text) {
  const isLine = kind === 'line';
  file.entries.push({
    id: file.nextId++, kind, text,
    level: isLine ? levelOf(text) : kind,
    n: isLine ? ++file.received : 0,
    el: null,
  });
  if (isLine) {
    file.lines++;
    rateCount++;
    if (file.index !== files[active]?.index) file.unread++;
  }
  if (file.entries.length > CAP + SLACK) trim(file);
  schedule();
}

function trim(file) {
  const excess = file.entries.length - CAP;
  if (excess <= 0) return;
  for (const e of file.entries.splice(0, excess)) {
    if (e.kind === 'line') file.lines--;
    if (e.el) {
      e.el.remove();
      if (e.kind === 'line') view.shown--;
    }
  }
}

function resetBuffer(file, resetCounters) {
  file.entries = [];
  file.lines = 0;
  file.unread = 0;
  if (resetCounters) file.received = 0;
  if (view.file === file) renderAll();
}

// ---- Rendering ----

function schedule() {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(frame);
}

function frame() {
  frameQueued = false;
  for (const f of files) trim(f);
  if (view.file && !paused) appendNew();
  updateChrome();
}

function isVisible(entry) {
  if (entry.kind !== 'line') return true; // notices always stay in context
  if (!levelsOn.has(entry.level)) return false;
  if (!filter.text || filter.error) return true;
  return filter.regex ? filter.re.test(entry.text) : entry.text.toLowerCase().includes(filter.needle);
}

function matchRanges(text) {
  const out = [];
  if (filter.regex) {
    const re = filter.reAll;
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      if (m[0] === '') { re.lastIndex++; continue; }
      out.push([m.index, m.index + m[0].length]);
    }
  } else {
    const hay = text.toLowerCase();
    for (let i = hay.indexOf(filter.needle); i !== -1; i = hay.indexOf(filter.needle, i + filter.needle.length)) {
      out.push([i, i + filter.needle.length]);
    }
  }
  return out;
}

function fillHighlighted(row, text) {
  const ranges = filter.text && !filter.error ? matchRanges(text) : [];
  if (!ranges.length) { row.textContent = text; return; }
  let pos = 0;
  for (const [start, end] of ranges) {
    if (start > pos) row.append(text.slice(pos, start));
    const mark = document.createElement('mark');
    mark.textContent = text.slice(start, end);
    row.append(mark);
    pos = end;
  }
  if (pos < text.length) row.append(text.slice(pos));
}

function buildRow(entry) {
  const row = document.createElement('div');
  row.className = entry.kind === 'line' ? 'row' : 'row sys';
  row.dataset.level = entry.level;
  if (entry.kind === 'line') {
    row.dataset.n = entry.n;
    fillHighlighted(row, entry.text);
  } else {
    row.textContent = entry.text;
  }
  return row;
}

// Appends every entry newer than view.renderedId that passes the filter.
function appendNew() {
  const entries = view.file.entries;
  let i = entries.length;
  while (i > 0 && entries[i - 1].id > view.renderedId) i--;
  if (i === entries.length) return;
  const frag = document.createDocumentFragment();
  for (; i < entries.length; i++) {
    const entry = entries[i];
    if (!isVisible(entry)) continue;
    entry.el = buildRow(entry);
    if (entry.kind === 'line') view.shown++;
    frag.append(entry.el);
  }
  view.renderedId = entries[entries.length - 1].id;
  ui.log.append(frag);
  if (view.follow) scrollToBottom();
}

function renderAll() {
  if (view.file) for (const e of view.file.entries) e.el = null;
  ui.log.textContent = '';
  view.file = files[active] || null;
  view.renderedId = 0;
  view.shown = 0;
  if (view.file) appendNew();
  if (view.follow) scrollToBottom();
  updateChrome();
}

function scrollToBottom() {
  ui.log.scrollTop = ui.log.scrollHeight;
}

// ---- Chrome ----

function buildTabs() {
  ui.tabs.textContent = '';
  files.forEach((file, i) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tab';
    button.id = 'tab-' + i;
    button.title = file.name;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-controls', 'log');
    const dot = document.createElement('span');
    dot.className = 'dot';
    const label = document.createElement('span');
    label.textContent = file.base;
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.hidden = true;
    button.append(dot, label, badge);
    button.addEventListener('click', () => select(i));
    ui.tabs.append(button);
    file.tab = { button, dot, badge };
  });
}

function select(i) {
  if (!files[i]) return;
  active = i;
  files[i].unread = 0;
  view.follow = true;
  renderAll();
}

function connectionSummary() {
  const counts = {};
  for (const f of files) counts[f.status] = (counts[f.status] || 0) + 1;
  const order = ['closed', 'reconnecting', 'connecting', 'connected'];
  const worst = order.find((s) => counts[s]) || 'connecting';
  const text = files.length === 1
    ? files[0].status
    : order.filter((s) => counts[s]).reverse().map((s) => `${counts[s]} ${s}`).join(', ');
  return { worst, text };
}

function updateChrome() {
  for (const [i, f] of files.entries()) {
    const { button, dot, badge } = f.tab;
    const selected = i === active;
    button.setAttribute('aria-selected', String(selected));
    button.tabIndex = selected ? 0 : -1;
    dot.dataset.status = f.status;
    dot.title = f.status;
    badge.hidden = selected || f.unread === 0;
    badge.textContent = f.unread > 9999 ? '9999+' : nf.format(f.unread);
  }

  if (files.length) {
    const { worst, text } = connectionSummary();
    ui.connDot.dataset.status = worst;
    ui.connText.textContent = text;
    ui.brand.classList.toggle('offline', !files.some((f) => f.status === 'connected'));
  }
  ui.total.textContent = `${nf.format(files.reduce((sum, f) => sum + f.received, 0))} lines`;
  ui.brand.classList.toggle('paused', paused);

  const file = view.file;
  const narrowed = !!filter.text && !filter.error || levelsOn.size < 5;
  if (filter.error) {
    ui.count.textContent = 'Invalid regex: ' + filter.error.split(': ').pop();
    ui.count.classList.add('error');
  } else {
    ui.count.classList.remove('error');
    ui.count.textContent = !file ? '' : narrowed
      ? `${nf.format(view.shown)} of ${nf.format(file.lines)} lines`
      : `${nf.format(file.lines)} lines`;
  }

  const pending = file ? Math.min(file.nextId - 1 - view.renderedId, file.entries.length) : 0;
  ui.pause.textContent = !paused ? 'Pause' : pending > 0 ? `Resume (${nf.format(pending)} new lines)` : 'Resume';
  ui.pause.setAttribute('aria-pressed', String(paused));

  ui.empty.textContent = emptyMessage(file);
  ui.empty.hidden = !ui.empty.textContent;
  ui.jump.hidden = view.follow || !ui.log.childElementCount;
}

function emptyMessage(file) {
  if (bootError) return bootError;
  if (!file) return files.length ? '' : 'Loading files…';
  if (ui.log.childElementCount) return '';
  if (file.entries.length) return paused ? 'Paused. Resume to show new lines.' : 'No lines match the current filter.';
  if (file.status === 'reconnecting') return 'Reconnecting to rtail…';
  if (file.status === 'closed') return 'The stream closed. Reload the page to reconnect.';
  return `Waiting for new lines in ${file.base}`;
}

function drawSparkline() {
  const max = Math.max(1, ...rateSamples);
  const step = 120 / (SPARK_SAMPLES - 1);
  const pts = rateSamples.map((v, i) => `${(i * step).toFixed(1)} ${(22 - (v / max) * 20).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  ui.sparkLine.setAttribute('d', line);
  ui.sparkArea.setAttribute('d', `${line} L120 24 L0 24 Z`);
}

function formatRate(n) {
  return n >= 1000 ? `${(n / 1000).toFixed(1)}k/s` : `${n}/s`;
}

// ---- Controls ----

function applyFilter() {
  const text = ui.filter.value;
  Object.assign(filter, { text, needle: text.toLowerCase(), error: null });
  if (text && filter.regex) {
    try {
      filter.re = new RegExp(text, 'i');
      filter.reAll = new RegExp(text, 'gi');
    } catch (err) {
      filter.error = err.message;
    }
  }
  ui.filterBox.classList.toggle('invalid', !!filter.error);
  ui.filterBox.classList.toggle('has-value', !!text);
  ui.filter.setAttribute('aria-invalid', String(!!filter.error));
  renderAll();
}

let filterTimer = 0;
ui.filter.addEventListener('input', () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyFilter, 80);
});

ui.regex.addEventListener('click', () => {
  filter.regex = !filter.regex;
  ui.regex.setAttribute('aria-pressed', String(filter.regex));
  applyFilter();
});

for (const chip of document.querySelectorAll('.chip')) {
  chip.addEventListener('click', () => {
    const level = chip.dataset.level;
    const on = !levelsOn.has(level);
    if (on) levelsOn.add(level); else levelsOn.delete(level);
    chip.setAttribute('aria-pressed', String(on));
    renderAll();
  });
}

function togglePause() {
  paused = !paused;
  if (!paused && view.file) appendNew();
  updateChrome();
}

ui.pause.addEventListener('click', togglePause);

ui.clear.addEventListener('click', () => {
  if (view.file) resetBuffer(view.file, false);
});

ui.numbers.addEventListener('click', () => {
  const on = ui.log.classList.toggle('numbered');
  ui.numbers.setAttribute('aria-pressed', String(on));
});

ui.log.addEventListener('scroll', () => {
  view.follow = ui.log.scrollHeight - ui.log.scrollTop - ui.log.clientHeight < 32;
  ui.jump.hidden = view.follow;
}, { passive: true });

ui.jump.addEventListener('click', () => {
  view.follow = true;
  scrollToBottom();
  ui.jump.hidden = true;
});

ui.tabs.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const next = (active + (e.key === 'ArrowRight' ? 1 : -1) + files.length) % files.length;
  select(next);
  files[next].tab.button.focus();
});

document.addEventListener('keydown', (e) => {
  const target = e.target instanceof Element ? e.target : document.body;
  if (e.key === 'Escape') {
    if (ui.filter.value) { ui.filter.value = ''; applyFilter(); }
    if (target === ui.filter) ui.filter.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === '/') {
    e.preventDefault();
    ui.filter.focus();
    ui.filter.select();
  } else if (e.key === ' ' && !target.closest('button')) {
    e.preventDefault();
    togglePause();
  }
});

setInterval(() => {
  rateSamples.push(rateCount);
  rateSamples.shift();
  ui.rate.textContent = formatRate(rateCount);
  rateCount = 0;
  drawSparkline();
}, 1000);

// ---- Boot ----

async function init() {
  drawSparkline();
  try {
    const res = await fetch('/api/files', { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const list = await res.json();
    if (!Array.isArray(list)) throw new Error('expected a JSON array');
    for (const item of list) {
      if (item && Number.isInteger(item.index) && typeof item.name === 'string') files.push(makeFile(item));
    }
  } catch (err) {
    bootError = `Couldn't load the file list (${err.message}). Check that rtail is still running, then reload.`;
    ui.connText.textContent = 'offline';
    ui.connDot.dataset.status = 'closed';
    updateChrome();
    return;
  }
  if (!files.length) {
    bootError = 'rtail is not following any files. Restart it with at least one file path.';
    updateChrome();
    return;
  }
  buildTabs();
  files.forEach(connect);
  select(0);
}

init();
</script>
</body>
</html>
